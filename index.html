<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A custom falling sand sandbox rebuilt as a lightweight JavaScript simulation."
    />
    <title>Cody Hsieh Portfolio</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/app.mobile-aspect.js" as="script" />
    <style>
      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 250, 0.96), transparent 34%),
          linear-gradient(180deg, #fffdf8 0%, #faf4eb 54%, #ede6db 100%);
        color: #2e2a24;
        font: 11px "Courier New", monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #loading-overlay.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-mark {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .loader-orbit {
        position: relative;
        width: 64px;
        height: 64px;
        border: 1px solid rgba(46, 42, 36, 0.16);
        border-radius: 50%;
        animation: loader-spin 1.2s linear infinite;
      }

      .loader-orbit::before,
      .loader-orbit::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #2e2a24;
      }

      .loader-orbit::before {
        top: -4px;
        left: 28px;
        width: 8px;
        height: 8px;
      }

      .loader-orbit::after {
        right: 5px;
        bottom: 9px;
        width: 5px;
        height: 5px;
        opacity: 0.45;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      #tutorial-overlay {
        position: fixed;
        inset: 0;
        z-index: 12;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(18, 14, 28, 0.74);
        opacity: 0;
        pointer-events: none;
        transition: opacity 260ms ease;
      }

      #tutorial-overlay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .tutorial-frame {
        background: #1a1224;
        color: #f7e6c4;
        font-family: "Press Start 2P", "Courier New", monospace;
        padding: 26px 24px 22px;
        width: min(380px, 100%);
        text-align: center;
        image-rendering: pixelated;
        box-shadow:
          0 0 0 4px #1a1224,
          0 0 0 8px #f7e6c4,
          0 0 0 12px #1a1224,
          10px 10px 0 12px rgba(0, 0, 0, 0.45);
      }

      .tutorial-title {
        margin: 0 0 18px;
        font-size: 14px;
        line-height: 1.4;
        letter-spacing: 0.08em;
        color: #ffd877;
      }

      .tutorial-line {
        margin: 12px 0;
        font-size: 10px;
        line-height: 1.7;
        letter-spacing: 0.06em;
      }

      .tutorial-line .tutorial-num {
        color: #ffd877;
        margin-right: 8px;
      }

      .tutorial-cta {
        margin-top: 18px;
        color: #ffd877;
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      #tutorial-dismiss {
        margin-top: 22px;
        background: #ffd877;
        color: #1a1224;
        font-family: inherit;
        font-size: 10px;
        letter-spacing: 0.1em;
        padding: 12px 20px;
        border: 0;
        cursor: pointer;
        box-shadow:
          0 0 0 3px #1a1224,
          0 0 0 6px #f7e6c4,
          5px 5px 0 6px rgba(0, 0, 0, 0.4);
        transition: transform 60ms ease;
      }

      #tutorial-dismiss:hover {
        transform: translate(-1px, -1px);
      }

      #tutorial-dismiss:active {
        transform: translate(2px, 2px);
        box-shadow:
          0 0 0 3px #1a1224,
          0 0 0 6px #f7e6c4,
          2px 2px 0 6px rgba(0, 0, 0, 0.4);
      }
    </style>
    <script defer src="/app.mobile-aspect.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XCYX5P4441"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XCYX5P4441');
    </script>
  </head>
  <body>
    <div id="loading-overlay" role="status" aria-live="polite">
      <div class="loader-mark">
        <div class="loader-orbit" aria-hidden="true"></div>
        <div>Loading elements</div>
      </div>
    </div>
    <div id="app-shell">
      <main id="playfield">
        <div class="canvas-frame">
          <canvas id="sand-canvas"></canvas>
          <canvas id="hud-canvas"></canvas>
        </div>
      </main>
      <div id="tutorial-overlay" role="dialog" aria-modal="true" aria-labelledby="tutorial-title" hidden>
        <div class="tutorial-frame">
          <h2 id="tutorial-title" class="tutorial-title">&#9733; WELCOME &#9733;</h2>
          <p class="tutorial-line"><span class="tutorial-num">1.</span>TAP A MATERIAL</p>
          <p class="tutorial-line"><span class="tutorial-num">2.</span>DRAG ON THE CANVAS</p>
          <p class="tutorial-cta">START WITH SAND</p>
          <button id="tutorial-dismiss" type="button">LET&#39;S GO</button>
        </div>
      </div>
      <div id="tilt-permission" class="tilt-permission is-hidden" aria-hidden="true">
        <div class="tilt-permission-panel" role="dialog" aria-modal="true" aria-labelledby="tilt-permission-title">
          <p id="tilt-permission-title">Enable tilt</p>
          <button id="tilt-allow" type="button">Allow motion</button>
          <button id="tilt-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var KEY = "cody-sand-tutorial-seen";
        try { if (localStorage.getItem(KEY)) return; } catch (_) { return; }
        var overlay = document.getElementById("tutorial-overlay");
        var btn = document.getElementById("tutorial-dismiss");
        var loading = document.getElementById("loading-overlay");
        if (!overlay || !btn || !loading) return;

        var fontLink = document.createElement("link");
        fontLink.rel = "stylesheet";
        fontLink.href = "https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap";
        document.head.appendChild(fontLink);

        function reveal() {
          overlay.hidden = false;
          requestAnimationFrame(function () { overlay.classList.add("is-visible"); });
          try { window.gtag && window.gtag("event", "tutorial_shown"); } catch (_) {}
        }
        function dismiss() {
          overlay.classList.remove("is-visible");
          setTimeout(function () { overlay.hidden = true; }, 280);
          try { localStorage.setItem(KEY, "1"); } catch (_) {}
          try { window.gtag && window.gtag("event", "tutorial_dismissed"); } catch (_) {}
        }
        btn.addEventListener("click", dismiss);

        if (loading.classList.contains("is-hidden")) {
          reveal();
        } else {
          var obs = new MutationObserver(function () {
            if (loading.classList.contains("is-hidden")) {
              obs.disconnect();
              setTimeout(reveal, 220);
            }
          });
          obs.observe(loading, { attributes: true, attributeFilter: ["class"] });
        }
      })();
    </script>
  </body>
</html>
