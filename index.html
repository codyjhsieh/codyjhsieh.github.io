<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A custom falling sand sandbox rebuilt as a lightweight JavaScript simulation."
    />
    <title>Cody Hsieh Portfolio</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/app.mobile-aspect.js" as="script" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
    <style>
      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 250, 0.96), transparent 34%),
          linear-gradient(180deg, #fffdf8 0%, #faf4eb 54%, #ede6db 100%);
        color: #2e2a24;
        font: 11px "Courier New", monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #loading-overlay.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-mark {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .loader-orbit {
        position: relative;
        width: 64px;
        height: 64px;
        border: 1px solid rgba(46, 42, 36, 0.16);
        border-radius: 50%;
        animation: loader-spin 1.2s linear infinite;
      }

      .loader-orbit::before,
      .loader-orbit::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #2e2a24;
      }

      .loader-orbit::before {
        top: -4px;
        left: 28px;
        width: 8px;
        height: 8px;
      }

      .loader-orbit::after {
        right: 5px;
        bottom: 9px;
        width: 5px;
        height: 5px;
        opacity: 0.45;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @property --cut-x { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
      @property --cut-y { syntax: '<percentage>'; inherits: true; initial-value: 62%; }
      @property --cut-r { syntax: '<length>'; inherits: true; initial-value: 30vmin; }
      @property --cut-fade { syntax: '<length>'; inherits: true; initial-value: 0px; }

      #tutorial-overlay {
        position: fixed;
        inset: 0;
        z-index: 12;
        opacity: 0;
        pointer-events: none;
        will-change: opacity;
        transition: opacity 700ms steps(6, end);
        --cut-x: 50%;
        --cut-y: 62%;
        --cut-r: 30vmin;
        --cut-fade: 0px;
      }

      #tutorial-overlay.is-visible { opacity: 1; }
      #tutorial-overlay[data-panel-open="true"] .tutorial-pixel { opacity: 0; }

      #tutorial-overlay[data-step="materials"] {
        --cut-x: 50%;
        --cut-y: 78%;
        --cut-r: 56vmin;
      }

      @media (min-width: 721px) {
        #tutorial-overlay[data-step="materials"] {
          --cut-x: 82%;
          --cut-y: 78%;
          --cut-r: 34vmin;
        }
      }

      .tutorial-pixel {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
        -webkit-mask-image: radial-gradient(
          circle at var(--cut-x) var(--cut-y),
          transparent 0,
          transparent calc(var(--cut-r) - var(--cut-fade)),
          black var(--cut-r)
        );
        mask-image: radial-gradient(
          circle at var(--cut-x) var(--cut-y),
          transparent 0,
          transparent calc(var(--cut-r) - var(--cut-fade)),
          black var(--cut-r)
        );
        will-change: opacity;
        transition:
          --cut-x 480ms steps(8, end),
          --cut-y 480ms steps(8, end),
          --cut-r 480ms steps(8, end),
          opacity 360ms steps(6, end);
      }

      .tutorial-hint {
        position: absolute;
        left: var(--cut-x);
        top: var(--cut-y);
        width: 16px;
        height: 16px;
        transform: translate(-50%, -50%);
        border-radius: 0;
        background: #1a1d24;
        box-shadow:
          0 0 0 4px #fdf6e3,
          0 0 0 8px #1a1d24,
          6px 6px 0 0 #1a1d24;
        animation: tutorial-pulse 560ms steps(1, end) infinite;
        pointer-events: none;
        transition:
          left 480ms steps(8, end),
          top 480ms steps(8, end);
      }

      @keyframes tutorial-pulse {
        0%, 49%   { transform: translate(-50%, -50%) scale(1); }
        50%, 100% { transform: translate(-50%, -50%) scale(1.4); }
      }

      .tutorial-caption {
        position: absolute;
        left: var(--cut-x);
        top: max(
          calc(env(safe-area-inset-top, 0px) + 16px),
          calc(var(--cut-y) - var(--cut-r) - 132px)
        );
        transform: translateX(-50%);
        padding: 16px 18px 14px;
        width: min(340px, calc(100vw - 32px));
        text-align: center;
        background: #fdf6e3;
        border: 4px solid #1a1d24;
        border-radius: 0;
        box-shadow:
          inset 0 0 0 2px #fdf6e3,
          inset 0 0 0 6px #1a1d24,
          8px 8px 0 0 #1a1d24;
        font-family: "Press Start 2P", "Courier New", monospace;
        color: #1a1d24;
        pointer-events: none;
        transition:
          top 480ms steps(8, end),
          left 480ms steps(8, end);
      }

      .tutorial-caption h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0;
        text-transform: uppercase;
        color: #1a1d24;
      }

      .tutorial-caption p {
        margin: 12px 0 0;
        font-size: 7px;
        font-weight: 400;
        line-height: 1.7;
        letter-spacing: 0;
        text-transform: uppercase;
        color: #1a1d24;
      }
    </style>
    <script defer src="/app.mobile-aspect.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XCYX5P4441"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XCYX5P4441');
    </script>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; pointer-events: none;">
      <defs>
        <filter id="liquid-glass-refraction" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="4" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="2" result="softNoise" />
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="loading-overlay" role="status" aria-live="polite">
      <div class="loader-mark">
        <div class="loader-orbit" aria-hidden="true"></div>
        <div>Loading elements</div>
      </div>
    </div>
    <div id="app-shell">
      <main id="playfield">
        <div class="canvas-frame">
          <canvas id="sand-canvas"></canvas>
          <canvas id="hud-canvas"></canvas>
        </div>
      </main>
      <div id="tutorial-overlay" role="status" aria-live="polite" aria-hidden="true">
        <canvas id="tutorial-pixel" class="tutorial-pixel" aria-hidden="true"></canvas>
        <div class="tutorial-hint" aria-hidden="true"></div>
        <div class="tutorial-caption">
          <h2 id="tutorial-title">Tap to make sand</h2>
          <p id="tutorial-subtitle">Drag anywhere on the canvas.</p>
        </div>
      </div>
      <div id="tilt-permission" class="tilt-permission is-hidden" aria-hidden="true">
        <div class="tilt-permission-panel" role="dialog" aria-modal="true" aria-labelledby="tilt-permission-title">
          <p id="tilt-permission-title">Enable tilt</p>
          <button id="tilt-allow" type="button">Allow motion</button>
          <button id="tilt-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var overlay = document.getElementById("tutorial-overlay");
        var title = document.getElementById("tutorial-title");
        var subtitle = document.getElementById("tutorial-subtitle");
        var loading = document.getElementById("loading-overlay");
        if (!overlay || !title || !subtitle || !loading) return;

        var STEPS = {
          paint: {
            title: "Tap to make sand",
            subtitle: "Drag anywhere on the canvas.",
          },
          materials: {
            title: "Now try Fireworks",
            subtitle: "Tap SAND in the dock, then pick Fireworks.",
          },
        };

        var alreadyPainted = false;
        var alreadyFireworked = false;
        var dismissed = false;
        var revealed = false;
        var REVEAL_DELAY_MS = 2000;
        var DISMISS_DELAY_MS = 820;
        var PIXEL_BLOCK = 18;

        function paintPixelated() {
          var src = document.getElementById("sand-canvas");
          var dst = document.getElementById("tutorial-pixel");
          if (!src || !dst || !src.width || !src.height) return;
          var dw = Math.max(2, Math.ceil(window.innerWidth / PIXEL_BLOCK));
          var dh = Math.max(2, Math.ceil(window.innerHeight / PIXEL_BLOCK));
          dst.width = dw;
          dst.height = dh;
          var ctx = dst.getContext("2d");
          if (!ctx) return;
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(src, 0, 0, dw, dh);
        }

        function setStep(name) {
          if (dismissed) return;
          overlay.setAttribute("data-step", name);
          title.textContent = STEPS[name].title;
          subtitle.textContent = STEPS[name].subtitle;
          try { window.gtag && window.gtag("event", "tutorial_step", { step: name }); } catch (_) {}
        }
        function reveal() {
          if (revealed || dismissed) return;
          revealed = true;
          if (alreadyFireworked) { dismissed = true; return; }
          setStep(alreadyPainted ? "materials" : "paint");
          paintPixelated();
          overlay.setAttribute("aria-hidden", "false");
          requestAnimationFrame(function () { overlay.classList.add("is-visible"); });
          try { window.gtag && window.gtag("event", "tutorial_shown"); } catch (_) {}
        }
        function dismiss(reason) {
          if (dismissed) return;
          dismissed = true;
          overlay.classList.remove("is-visible");
          setTimeout(function () { overlay.setAttribute("aria-hidden", "true"); }, DISMISS_DELAY_MS);
          try { window.gtag && window.gtag("event", "tutorial_completed", { reason: reason || "done" }); } catch (_) {}
        }

        window.addEventListener("cody:painted", function () {
          alreadyPainted = true;
          if (revealed && overlay.getAttribute("data-step") === "paint") {
            setStep("materials");
            setTimeout(paintPixelated, 80);
          }
        });
        window.addEventListener("cody:element-change", function (e) {
          if (!e || !e.detail || e.detail.species !== "firework") return;
          alreadyFireworked = true;
          if (revealed && overlay.getAttribute("data-step") === "materials") {
            dismiss("firework-selected");
          }
        });
        window.addEventListener("cody:hud-section", function (e) {
          if (!e || !e.detail) return;
          if (e.detail.open) {
            overlay.setAttribute("data-panel-open", "true");
          } else {
            overlay.removeAttribute("data-panel-open");
          }
        });

        function scheduleReveal() { setTimeout(reveal, REVEAL_DELAY_MS); }

        if (loading.classList.contains("is-hidden")) {
          scheduleReveal();
        } else {
          var obs = new MutationObserver(function () {
            if (loading.classList.contains("is-hidden")) {
              obs.disconnect();
              scheduleReveal();
            }
          });
          obs.observe(loading, { attributes: true, attributeFilter: ["class"] });
        }
      })();
    </script>
  </body>
</html>
