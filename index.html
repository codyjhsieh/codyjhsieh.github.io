<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A custom falling sand sandbox rebuilt as a lightweight JavaScript simulation."
    />
    <title>Cody Hsieh Portfolio</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/app.mobile-aspect.js" as="script" />
    <style>
      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 250, 0.96), transparent 34%),
          linear-gradient(180deg, #fffdf8 0%, #faf4eb 54%, #ede6db 100%);
        color: #2e2a24;
        font: 11px "Courier New", monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #loading-overlay.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-mark {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .loader-orbit {
        position: relative;
        width: 64px;
        height: 64px;
        border: 1px solid rgba(46, 42, 36, 0.16);
        border-radius: 50%;
        animation: loader-spin 1.2s linear infinite;
      }

      .loader-orbit::before,
      .loader-orbit::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #2e2a24;
      }

      .loader-orbit::before {
        top: -4px;
        left: 28px;
        width: 8px;
        height: 8px;
      }

      .loader-orbit::after {
        right: 5px;
        bottom: 9px;
        width: 5px;
        height: 5px;
        opacity: 0.45;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .liquid-glass {
        position: relative;
        background:
          linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.24) 0%,
            rgba(255, 255, 255, 0.10) 48%,
            rgba(255, 255, 255, 0.18) 100%
          );
        -webkit-backdrop-filter: blur(28px) saturate(180%) url(#liquid-glass-refraction);
        backdrop-filter: blur(28px) saturate(180%) url(#liquid-glass-refraction);
        border-radius: 28px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          inset 0 -1px 0 rgba(255, 255, 255, 0.08),
          0 22px 56px rgba(0, 0, 0, 0.24),
          0 0 56px rgba(255, 220, 150, 0.28),
          0 0 96px rgba(214, 210, 255, 0.36),
          0 0 148px rgba(164, 219, 255, 0.28);
        isolation: isolate;
      }

      .liquid-glass::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          ellipse 78% 42% at 50% 0%,
          rgba(255, 255, 255, 0.46),
          transparent 62%
        );
        opacity: 0.7;
        mix-blend-mode: screen;
        pointer-events: none;
      }

      @supports not (backdrop-filter: blur(1px)) {
        .liquid-glass {
          background: rgba(248, 248, 250, 0.92);
        }
      }

      #tutorial-overlay {
        position: fixed;
        inset: 0;
        z-index: 12;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(15, 16, 22, 0.18);
        opacity: 0;
        pointer-events: none;
        transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #tutorial-overlay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .tutorial-card {
        width: min(360px, 100%);
        padding: 30px 28px 26px;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
        color: rgba(20, 22, 30, 0.92);
        transform: scale(0.96) translateY(10px);
        transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      #tutorial-overlay.is-visible .tutorial-card {
        transform: scale(1) translateY(0);
      }

      .tutorial-card h2 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: rgba(20, 22, 30, 0.96);
      }

      .tutorial-card p {
        margin: 0;
        font-size: 15px;
        font-weight: 400;
        line-height: 1.5;
        color: rgba(20, 22, 30, 0.66);
      }

      .tutorial-card .tutorial-cta {
        margin-top: 6px;
        font-weight: 500;
        color: rgba(20, 22, 30, 0.92);
      }

      #tutorial-dismiss {
        margin-top: 24px;
        padding: 11px 30px;
        font: 600 14px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI", system-ui, sans-serif;
        letter-spacing: -0.01em;
        color: rgba(20, 22, 30, 0.96);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.58) 0%,
          rgba(255, 255, 255, 0.32) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.55);
        -webkit-backdrop-filter: blur(20px) saturate(170%);
        backdrop-filter: blur(20px) saturate(170%);
        border-radius: 999px;
        cursor: pointer;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.65),
          0 6px 18px rgba(0, 0, 0, 0.10);
        transition: transform 140ms ease, box-shadow 140ms ease;
      }

      #tutorial-dismiss:hover {
        transform: translateY(-1px);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.75),
          0 10px 22px rgba(0, 0, 0, 0.14);
      }

      #tutorial-dismiss:active {
        transform: translateY(0);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          0 3px 10px rgba(0, 0, 0, 0.10);
      }
    </style>
    <script defer src="/app.mobile-aspect.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XCYX5P4441"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XCYX5P4441');
    </script>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; pointer-events: none;">
      <defs>
        <filter id="liquid-glass-refraction" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="4" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="2" result="softNoise" />
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="loading-overlay" role="status" aria-live="polite">
      <div class="loader-mark">
        <div class="loader-orbit" aria-hidden="true"></div>
        <div>Loading elements</div>
      </div>
    </div>
    <div id="app-shell">
      <main id="playfield">
        <div class="canvas-frame">
          <canvas id="sand-canvas"></canvas>
          <canvas id="hud-canvas"></canvas>
        </div>
      </main>
      <div id="tutorial-overlay" role="dialog" aria-modal="true" aria-labelledby="tutorial-title" hidden>
        <div class="tutorial-card liquid-glass">
          <h2 id="tutorial-title">Welcome</h2>
          <p>Tap a material, drag to paint.</p>
          <p class="tutorial-cta">Start with sand.</p>
          <button id="tutorial-dismiss" type="button">Begin</button>
        </div>
      </div>
      <div id="tilt-permission" class="tilt-permission is-hidden" aria-hidden="true">
        <div class="tilt-permission-panel" role="dialog" aria-modal="true" aria-labelledby="tilt-permission-title">
          <p id="tilt-permission-title">Enable tilt</p>
          <button id="tilt-allow" type="button">Allow motion</button>
          <button id="tilt-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var KEY = "cody-sand-tutorial-seen";
        try { if (localStorage.getItem(KEY)) return; } catch (_) { return; }
        var overlay = document.getElementById("tutorial-overlay");
        var btn = document.getElementById("tutorial-dismiss");
        var loading = document.getElementById("loading-overlay");
        if (!overlay || !btn || !loading) return;

        function reveal() {
          overlay.hidden = false;
          requestAnimationFrame(function () { overlay.classList.add("is-visible"); });
          try { window.gtag && window.gtag("event", "tutorial_shown"); } catch (_) {}
        }
        function dismiss() {
          overlay.classList.remove("is-visible");
          setTimeout(function () { overlay.hidden = true; }, 280);
          try { localStorage.setItem(KEY, "1"); } catch (_) {}
          try { window.gtag && window.gtag("event", "tutorial_dismissed"); } catch (_) {}
        }
        btn.addEventListener("click", dismiss);

        if (loading.classList.contains("is-hidden")) {
          reveal();
        } else {
          var obs = new MutationObserver(function () {
            if (loading.classList.contains("is-hidden")) {
              obs.disconnect();
              setTimeout(reveal, 220);
            }
          });
          obs.observe(loading, { attributes: true, attributeFilter: ["class"] });
        }
      })();
    </script>
  </body>
</html>
