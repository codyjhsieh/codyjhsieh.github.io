<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A custom falling sand sandbox rebuilt as a lightweight JavaScript simulation."
    />
    <title>Cody Hsieh Portfolio</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/app.mobile-aspect.js" as="script" />
    <style>
      #loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 18%, rgba(255, 255, 250, 0.96), transparent 34%),
          linear-gradient(180deg, #fffdf8 0%, #faf4eb 54%, #ede6db 100%);
        color: #2e2a24;
        font: 11px "Courier New", monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #loading-overlay.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-mark {
        display: grid;
        gap: 16px;
        justify-items: center;
      }

      .loader-orbit {
        position: relative;
        width: 64px;
        height: 64px;
        border: 1px solid rgba(46, 42, 36, 0.16);
        border-radius: 50%;
        animation: loader-spin 1.2s linear infinite;
      }

      .loader-orbit::before,
      .loader-orbit::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        background: #2e2a24;
      }

      .loader-orbit::before {
        top: -4px;
        left: 28px;
        width: 8px;
        height: 8px;
      }

      .loader-orbit::after {
        right: 5px;
        bottom: 9px;
        width: 5px;
        height: 5px;
        opacity: 0.45;
      }

      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .liquid-glass {
        position: relative;
        background:
          linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.24) 0%,
            rgba(255, 255, 255, 0.10) 48%,
            rgba(255, 255, 255, 0.18) 100%
          );
        -webkit-backdrop-filter: blur(28px) saturate(180%);
        backdrop-filter: blur(28px) saturate(180%);
        border-radius: 28px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          inset 0 -1px 0 rgba(255, 255, 255, 0.08),
          0 22px 56px rgba(0, 0, 0, 0.24),
          0 0 56px rgba(255, 220, 150, 0.28),
          0 0 96px rgba(214, 210, 255, 0.36),
          0 0 148px rgba(164, 219, 255, 0.28);
        isolation: isolate;
      }

      .liquid-glass::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          ellipse 78% 42% at 50% 0%,
          rgba(255, 255, 255, 0.46),
          transparent 62%
        );
        opacity: 0.7;
        mix-blend-mode: screen;
        pointer-events: none;
      }

      @supports not (backdrop-filter: blur(1px)) {
        .liquid-glass {
          background: rgba(248, 248, 250, 0.92);
        }
      }

      @property --cut-x { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
      @property --cut-y { syntax: '<percentage>'; inherits: true; initial-value: 42%; }
      @property --cut-r { syntax: '<length>'; inherits: true; initial-value: 36vmin; }
      @property --cut-fade { syntax: '<length>'; inherits: true; initial-value: 70px; }

      #tutorial-overlay {
        position: fixed;
        inset: 0;
        z-index: 12;
        opacity: 0;
        pointer-events: none;
        transition: opacity 400ms cubic-bezier(0.22, 1, 0.36, 1);
        --cut-x: 50%;
        --cut-y: 42%;
        --cut-r: 36vmin;
        --cut-fade: 70px;
      }

      #tutorial-overlay.is-visible { opacity: 1; }

      #tutorial-overlay[data-step="materials"] {
        --cut-x: 50%;
        --cut-y: 82%;
        --cut-r: 22vmin;
        --cut-fade: 50px;
      }

      @media (min-width: 721px) {
        #tutorial-overlay[data-step="materials"] {
          --cut-x: 82%;
          --cut-y: 86%;
          --cut-r: 18vmin;
        }
      }

      .tutorial-glass {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.10) 0%,
          rgba(255, 255, 255, 0.04) 50%,
          rgba(255, 255, 255, 0.08) 100%
        );
        -webkit-backdrop-filter: blur(10px) saturate(150%);
        backdrop-filter: blur(10px) saturate(150%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.24),
          inset 0 0 0 1px rgba(255, 255, 255, 0.08);
        -webkit-mask-image: radial-gradient(
          circle at var(--cut-x) var(--cut-y),
          transparent 0,
          transparent calc(var(--cut-r) - var(--cut-fade)),
          black var(--cut-r)
        );
        mask-image: radial-gradient(
          circle at var(--cut-x) var(--cut-y),
          transparent 0,
          transparent calc(var(--cut-r) - var(--cut-fade)),
          black var(--cut-r)
        );
        transition:
          --cut-x 620ms cubic-bezier(0.22, 1, 0.36, 1),
          --cut-y 620ms cubic-bezier(0.22, 1, 0.36, 1),
          --cut-r 620ms cubic-bezier(0.22, 1, 0.36, 1),
          --cut-fade 620ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .tutorial-hint {
        position: absolute;
        left: var(--cut-x);
        top: var(--cut-y);
        width: 14px;
        height: 14px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: rgba(20, 22, 30, 0.92);
        box-shadow:
          0 0 0 4px rgba(255, 255, 255, 0.92),
          0 0 0 5px rgba(20, 22, 30, 0.32),
          0 4px 12px rgba(0, 0, 0, 0.25);
        animation: tutorial-pulse 1.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        pointer-events: none;
        transition:
          left 620ms cubic-bezier(0.22, 1, 0.36, 1),
          top 620ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .tutorial-hint::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 2px solid rgba(20, 22, 30, 0.7);
        animation: tutorial-ring 1.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      @keyframes tutorial-pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); }
        50% { transform: translate(-50%, -50%) scale(1.18); }
      }

      @keyframes tutorial-ring {
        0%   { transform: scale(1); opacity: 0.9; }
        80%  { transform: scale(3.4); opacity: 0; }
        100% { transform: scale(3.4); opacity: 0; }
      }

      .tutorial-caption {
        position: absolute;
        left: 50%;
        top: max(28px, env(safe-area-inset-top, 0px));
        transform: translateX(-50%);
        padding: 14px 22px;
        width: min(380px, calc(100vw - 32px));
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
          "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
        color: rgba(20, 22, 30, 0.92);
        border-radius: 22px;
        pointer-events: none;
      }

      .tutorial-caption h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: rgba(20, 22, 30, 0.96);
      }

      .tutorial-caption p {
        margin: 4px 0 0;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.45;
        color: rgba(20, 22, 30, 0.65);
      }
    </style>
    <script defer src="/app.mobile-aspect.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XCYX5P4441"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XCYX5P4441');
    </script>
  </head>
  <body>
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position: absolute; pointer-events: none;">
      <defs>
        <filter id="liquid-glass-refraction" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="4" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="2" result="softNoise" />
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="loading-overlay" role="status" aria-live="polite">
      <div class="loader-mark">
        <div class="loader-orbit" aria-hidden="true"></div>
        <div>Loading elements</div>
      </div>
    </div>
    <div id="app-shell">
      <main id="playfield">
        <div class="canvas-frame">
          <canvas id="sand-canvas"></canvas>
          <canvas id="hud-canvas"></canvas>
        </div>
      </main>
      <div id="tutorial-overlay" role="status" aria-live="polite" hidden>
        <div class="tutorial-glass" aria-hidden="true"></div>
        <div class="tutorial-hint" aria-hidden="true"></div>
        <div class="tutorial-caption liquid-glass">
          <h2 id="tutorial-title">Tap to make sand</h2>
          <p id="tutorial-subtitle">Drag anywhere on the canvas.</p>
        </div>
      </div>
      <div id="tilt-permission" class="tilt-permission is-hidden" aria-hidden="true">
        <div class="tilt-permission-panel" role="dialog" aria-modal="true" aria-labelledby="tilt-permission-title">
          <p id="tilt-permission-title">Enable tilt</p>
          <button id="tilt-allow" type="button">Allow motion</button>
          <button id="tilt-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var overlay = document.getElementById("tutorial-overlay");
        var title = document.getElementById("tutorial-title");
        var subtitle = document.getElementById("tutorial-subtitle");
        var loading = document.getElementById("loading-overlay");
        if (!overlay || !title || !subtitle || !loading) return;

        var STEPS = {
          paint: {
            title: "Tap to make sand",
            subtitle: "Drag anywhere on the canvas.",
          },
          materials: {
            title: "Now try Fireworks",
            subtitle: "Tap MORE in the dock, then pick Fireworks.",
          },
        };

        function setStep(name) {
          overlay.setAttribute("data-step", name);
          title.textContent = STEPS[name].title;
          subtitle.textContent = STEPS[name].subtitle;
          try { window.gtag && window.gtag("event", "tutorial_step", { step: name }); } catch (_) {}
        }
        function reveal() {
          overlay.hidden = false;
          setStep("paint");
          requestAnimationFrame(function () { overlay.classList.add("is-visible"); });
          try { window.gtag && window.gtag("event", "tutorial_shown"); } catch (_) {}
        }
        function dismiss(reason) {
          overlay.classList.remove("is-visible");
          setTimeout(function () { overlay.hidden = true; }, 400);
          try { window.gtag && window.gtag("event", "tutorial_completed", { reason: reason || "done" }); } catch (_) {}
        }

        window.addEventListener("cody:painted", function () {
          if (overlay.getAttribute("data-step") === "paint") setStep("materials");
        });
        window.addEventListener("cody:element-change", function (e) {
          var step = overlay.getAttribute("data-step");
          if (step === "materials" && e && e.detail && e.detail.species === "firework") {
            dismiss("firework-selected");
          }
        });

        if (loading.classList.contains("is-hidden")) {
          reveal();
        } else {
          var obs = new MutationObserver(function () {
            if (loading.classList.contains("is-hidden")) {
              obs.disconnect();
              setTimeout(reveal, 220);
            }
          });
          obs.observe(loading, { attributes: true, attributeFilter: ["class"] });
        }
      })();
    </script>
  </body>
</html>
